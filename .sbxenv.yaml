schemaVersion: "1"

agent: sbx-kit-codex

kits:
  - source: docker.io/docker/sbx-kit-codex:0.159.2

workspace: ${{ env.projectDir }}

sandboxOptions:
  cpus: 8
  memory: 8g

  # Globale Skills in jeder Sandbox
  skills: readonly

  pullPolicy: always


# -------------------------------------------------------
# Globale MCP Server
# -------------------------------------------------------

mcp:
  servers:

    # OpenAI Dokumentation
    - name: openai-docs
      url: https://developers.openai.com/mcp

    # Beispiel: lokaler stdio MCP
    - name: playwright
      command: docker
      args:
        - run
        - -i
        - --rm
        - --init
        - --pull=always
        - mcr.microsoft.com/playwright/mcp


# -------------------------------------------------------
# OpenAI Auth
# -------------------------------------------------------

bindings:
  openai:
    oauth:
      domains:
        - auth.openai.com
        - chatgpt.com


# -------------------------------------------------------
# Globale Codex Settings
# -------------------------------------------------------

lifecycle:
  postCreate:
    - name: Apply global Codex TUI settings
      command: 'powershell.exe -NoProfile -NonInteractive -Command "& (Join-Path $env:LOCALAPPDATA ''Programs\Git\bin\bash.exe'') -c ''bash "$HOME/.config/codex-sbx/apply-tui.sh"''"'